<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0B0C10; }
    a { color: #8EA2FF; text-decoration: none; }
    a:hover { color: #B6C2FF; }
    .disp { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace; }
    @keyframes floatGlow {
      0%, 100% { transform: translate(-6%, -4%) scale(1); }
      50%      { transform: translate(6%, 6%) scale(1.14); }
    }
    .glow { animation: floatGlow 18s ease-in-out infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
    .live-dot { animation: pulseDot 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .glow, .live-dot { animation: none; } }
  </style>
</helmet>

<div class="disp" style="--a1: {{accent}}; position: relative; width: 375px; height: 812px; overflow: hidden; background: #0B0C10; color: #F2F3F7; display: flex; flex-direction: column;">

  <div class="glow" style="position: absolute; top: -8%; left: -18%; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, {{accent}} 0%, rgba(11,12,16,0) 64%); opacity: 0.20; filter: blur(20px); pointer-events: none;"></div>

  <canvas id="fieldMobile" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none;"></canvas>

  <div style="position: absolute; inset: 0; pointer-events: none; opacity: 0.5; mix-blend-mode: overlay; background-image: url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.42'/></svg>&quot;);"></div>

  <header style="position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.055);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 30px; height: 30px; border: 1px solid {{accent}}; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 11px; font-weight: 500; color: {{accent}};">KG</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid #23262F; border-radius: 999px;">
        <span class="mono" style="font-size: 10.5px; font-weight: 500; padding: 6px 11px; border-radius: 999px; background: {{accent}}; color: #0B0C10;">EN</span>
        <span class="mono" style="font-size: 10.5px; font-weight: 500; padding: 6px 11px; border-radius: 999px; color: #7B8195;">ES</span>
      </div>
      <button style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid #23262F; border-radius: 12px; background: transparent; color: #F2F3F7;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg>
      </button>
    </div>
  </header>

  <main style="position: relative; z-index: 3; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 0 20px;">

    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="live-dot" style="width: 6px; height: 6px; border-radius: 50%; background: #5FE3B0; box-shadow: 0 0 10px #5FE3B0;"></span>
      <span class="mono" style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #A8ADBD;">Available for new work</span>
    </div>

    <h1 style="margin: 0; font-size: 46px; line-height: 0.98; font-weight: 700; font-stretch: 112%; letter-spacing: -0.035em;">
      I build and ship <span style="color: {{accent}};">production software.</span>
    </h1>

    <p style="margin: 0; font-size: 15.5px; line-height: 1.6; color: #A8ADBD;">
      Kenneth Granados, full stack engineer. Eleven years building platforms for US companies in fintech, healthcare, e&#8209;commerce and analytics.
    </p>

    <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 6px;">
      <a href="#contact" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 999px; background: {{accent}}; color: #0B0C10; font-size: 15.5px; font-weight: 600;">
        Start a project
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </a>
      <a href="#work" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; border: 1px solid #2C3040; color: #F2F3F7; font-size: 15.5px; font-weight: 500;">
        See the work
      </a>
    </div>

    <span class="mono" style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #7B8195; padding-top: 4px;">Costa Rica &middot; UTC&minus;6</span>

  </main>

  <div style="position: relative; z-index: 3; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid rgba(255,255,255,0.055);">
    <sc-for list="{{stats}}" as="stat" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 5px; padding: 18px 20px; border-right: 1px solid rgba(255,255,255,0.055); border-bottom: 1px solid rgba(255,255,255,0.055);">
        <span style="font-size: 26px; font-weight: 700; font-stretch: 108%; letter-spacing: -0.03em; line-height: 1;">{{stat.value}}</span>
        <span class="mono" style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7B8195;">{{stat.label}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#5FE3B0","#FF9E6B","#D9A9FF"],"section":"Theme"}}'>
class Component extends DCLogic {
  componentDidMount() {
    const canvas = document.getElementById('fieldMobile');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const accent = this.props.accent ?? '#8EA2FF';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const w = canvas.offsetWidth;
    const h = canvas.offsetHeight;

    // Same density rule as desktop, so a phone gets roughly a third of the points.
    const count = Math.max(18, Math.round((w * h) / 15000));
    const points = [];
    for (let i = 0; i < count; i++) {
      points.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.14,
        vy: (Math.random() - 0.5) * 0.14
      });
    }

    const LINK = 140 * 140;

    const draw = () => {
      ctx.clearRect(0, 0, w, h);

      if (!reduced) {
        for (const p of points) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;
        }
      }

      ctx.strokeStyle = accent;
      ctx.lineWidth = 1;
      for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
          const dx = points[i].x - points[j].x;
          const dy = points[i].y - points[j].y;
          const dist = dx * dx + dy * dy;
          if (dist < LINK) {
            ctx.globalAlpha = (1 - dist / LINK) * 0.22;
            ctx.beginPath();
            ctx.moveTo(points[i].x, points[i].y);
            ctx.lineTo(points[j].x, points[j].y);
            ctx.stroke();
          }
        }
      }

      ctx.globalAlpha = 0.7;
      ctx.fillStyle = accent;
      for (const p of points) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (!reduced) this.raf = requestAnimationFrame(draw);
    };

    draw();
  }

  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
  }

  renderVals() {
    return {
      accent: this.props.accent ?? '#8EA2FF',
      stats: [
        { value: '11', label: 'Years shipping' },
        { value: '6,000+', label: 'Products migrated' },
        { value: '~60%', label: 'Faster deploys' },
        { value: '4', label: 'Industries' }
      ]
    };
  }
}
</script>
</body>
</html>
